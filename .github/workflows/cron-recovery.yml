# RD-OPS-GA-02B — Group B: financial recovery + retry + time-sensitive dispatch.
#
# Self-healing safety nets (uncredited registrations/donations, unapplied top-ups,
# failed webhook re-drive) plus reminder dispatch and operator-alert delivery. Every
# endpoint is idempotent (deterministic ledger keys / status-guarded claims), so
# repeated ticks never double-apply. Triggered SEQUENTIALLY, money paths first.
name: Cron - Group B (recovery, every 10 min)

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch: {}

permissions: {}

concurrency:
  group: cron-recovery
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CRON_BASE_URL: ${{ secrets.CRON_BASE_URL }}
      CRON_SECRET: ${{ secrets.CRON_SECRET }}
    steps:
      - name: Preflight (secrets present)
        run: |
          test -n "$CRON_BASE_URL" || { echo "::error::CRON_BASE_URL secret is not set"; exit 1; }
          test -n "$CRON_SECRET"   || { echo "::error::CRON_SECRET secret is not set"; exit 1; }

      - name: registration-reconciliation
        continue-on-error: true
        run: |
          curl -sS -X POST "$CRON_BASE_URL/api/cron/registration-reconciliation" \
            -H "Authorization: Bearer $CRON_SECRET" \
            --retry 2 --retry-delay 5 --max-time 65 --fail-with-body

      - name: donation-reconciliation
        continue-on-error: true
        run: |
          curl -sS -X POST "$CRON_BASE_URL/api/cron/donation-reconciliation" \
            -H "Authorization: Bearer $CRON_SECRET" \
            --retry 2 --retry-delay 5 --max-time 65 --fail-with-body

      - name: wallet-reconciliation
        continue-on-error: true
        run: |
          curl -sS -X POST "$CRON_BASE_URL/api/cron/wallet-reconciliation" \
            -H "Authorization: Bearer $CRON_SECRET" \
            --retry 2 --retry-delay 5 --max-time 65 --fail-with-body

      # RD-PRINT-BILL-P4 — ID-badge purchase checkouts past their window + grace: settles a
      # captured payment (activate once, or hold), expires unpaid ones. Never refunds. Idempotent.
      - name: badge-orders-reconcile
        continue-on-error: true
        run: |
          curl -sS -X POST "$CRON_BASE_URL/api/cron/badge-orders-reconcile" \
            -H "Authorization: Bearer $CRON_SECRET" \
            --retry 2 --retry-delay 5 --max-time 65 --fail-with-body

      # RD-PRINT-P8 (W6) — ID-badge billing rounds left open by a job that ended without settling them:
      # settles them (transactional, idempotent; running jobs are never force-settled). Own budget and
      # cursor — independent of print-generation's inline fast-path sweep. Never charges or refunds.
      - name: badge-rounds-reconcile
        continue-on-error: true
        run: |
          curl -sS -X POST "$CRON_BASE_URL/api/cron/badge-rounds-reconcile" \
            -H "Authorization: Bearer $CRON_SECRET" \
            --retry 2 --retry-delay 5 --max-time 65 --fail-with-body

      # MC-05 — Media Credits: retries captured-but-ungranted purchases and
      # approved-but-unpaid refunds. Idempotent; a no-op when credits are disabled.
      - name: media-credit-reconciliation
        continue-on-error: true
        run: |
          curl -sS -X POST "$CRON_BASE_URL/api/cron/media-credit-reconciliation" \
            -H "Authorization: Bearer $CRON_SECRET" \
            --retry 2 --retry-delay 5 --max-time 65 --fail-with-body

      # MC-06D — Media Credits upload sessions: seals expired sessions, settles them,
      # then reclaims reservations. Idempotent, time-budgeted, and — unlike the
      # reconciliation cron above — runs even when creditsEnabled is false, so holds
      # taken while the feature was on can never be stranded.
      - name: media-credit-sessions
        continue-on-error: true
        run: |
          curl -sS -X POST "$CRON_BASE_URL/api/cron/media-credit-sessions" \
            -H "Authorization: Bearer $CRON_SECRET" \
            --retry 2 --retry-delay 5 --max-time 65 --fail-with-body

      - name: webhooks
        continue-on-error: true
        run: |
          curl -sS -X POST "$CRON_BASE_URL/api/cron/webhooks" \
            -H "Authorization: Bearer $CRON_SECRET" \
            --retry 2 --retry-delay 5 --max-time 65 --fail-with-body

      - name: reminders
        continue-on-error: true
        run: |
          curl -sS -X POST "$CRON_BASE_URL/api/cron/reminders" \
            -H "Authorization: Bearer $CRON_SECRET" \
            --retry 2 --retry-delay 5 --max-time 65 --fail-with-body

      # RD-REVIEW-02 — event review deadlines: reminders, Action Required after the first 24 h,
      # automatic closure after the second 24 h. Status + review-cycle compare-and-set per event
      # (idempotent); never moves money. Runs before ops-alerts so its notices drain this tick.
      - name: review-deadlines
        continue-on-error: true
        run: |
          curl -sS -X POST "$CRON_BASE_URL/api/cron/review-deadlines" \
            -H "Authorization: Bearer $CRON_SECRET" \
            --retry 2 --retry-delay 5 --max-time 65 --fail-with-body

      # RD-CAPACITY-01 — organizer capacity-threshold notifications (50/70/85/95/100%).
      # Idempotent: each threshold is claimed in a Firestore transaction that re-decides from
      # the stored state, so an overlapping run sends nothing. continue-on-error like every
      # sibling here: a missed notification must not fail the whole recovery workflow.
      # HELD BACK for the initial release (2026-10-13, owner): the first sweep may notify
      # existing organizers. Skipped on scheduled AND manual runs until the repository
      # variable CAPACITY_ALERTS_ENABLED is set to 'true' (Settings → Secrets and variables
      # → Actions → Variables). Unset or any other value = skipped. Nothing else changes.
      - name: capacity-alerts
        if: ${{ vars.CAPACITY_ALERTS_ENABLED == 'true' }}
        continue-on-error: true
        run: |
          curl -sS -X POST "$CRON_BASE_URL/api/cron/capacity-alerts" \
            -H "Authorization: Bearer $CRON_SECRET" \
            --retry 2 --retry-delay 5 --max-time 65 --fail-with-body

      - name: ops-alerts
        continue-on-error: true
        run: |
          curl -sS -X POST "$CRON_BASE_URL/api/cron/ops-alerts" \
            -H "Authorization: Bearer $CRON_SECRET" \
            --retry 2 --retry-delay 5 --max-time 65 --fail-with-body
